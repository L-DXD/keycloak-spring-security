plugins {
    id 'java-library'
}

description = 'Keycloak Spring Security Web - Servlet(Spring MVC) 구현: 로그인, 요청 인증, 갱신, CSRF, 로그아웃'

dependencies {
    api project(':keycloak-spring-security-core')

    api 'org.springframework.security:spring-security-web'
    api 'org.springframework.security:spring-security-config'
    api 'org.springframework.security:spring-security-oauth2-client'

    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-test'
    // 갱신 동시성 통합 테스트(REFRESH-02·09): JDBC 세션 저장소 + H2
    testImplementation 'com.h2database:h2'
    // 토큰 응답(JSON)을 읽는 변환기. 실제 앱은 spring-boot-starter-webmvc가 넣는다
    testImplementation 'tools.jackson.core:jackson-databind'
    // MDC 테스트(EVT-03): SLF4J 구현이 없으면 MDC가 아무것도 하지 않는다
    testRuntimeOnly 'ch.qos.logback:logback-classic'
}
