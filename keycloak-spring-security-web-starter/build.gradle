plugins {
    id 'java-library'
}

description = 'Keycloak Spring Security Web Starter - Servlet 앱용 자동 설정'

dependencies {
    api project(':keycloak-spring-security-web')

    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // @DependsOnDatabaseInitialization: 앱에 JDBC·Flyway가 있으면 그 모듈이 같이 들어온다
    compileOnly 'org.springframework.boot:spring-boot-sql'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework.boot:spring-boot-sql'
    testImplementation 'com.h2database:h2'
    // OAuth2 Client가 토큰·오류 응답을 읽는 JSON 변환기. 실제 앱은 spring-boot-starter-webmvc가 넣는다
    testImplementation 'tools.jackson.core:jackson-databind'
    // EXT-03: 공개 클래스에 final이 없는지 (core·web·starter를 한 번에 본다)
    testImplementation "com.tngtech.archunit:archunit:${archunitVersion}"
}
