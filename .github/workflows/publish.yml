name: Publish to Maven Central

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

  # 수동 실행 지원 (테스트/긴급 배포용)
  workflow_dispatch:

jobs:
  publish:
    name: Publish All Modules to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION=$(grep "^projectVersion=" gradle.properties | cut -d'=' -f2)
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build all modules
        run: ./gradlew build --no-daemon

      # 서명 키는 이 단계의 셸 안에서만 풀어 Gradle에 넘긴다.
      # GITHUB_ENV에 넣으면 비밀값 마스킹이 걸리지 않아 뒤 단계마다 로그의 환경 변수 목록에 키가 그대로 찍힌다.
      # 배포 순서: core → web, webflux → web-starter, webflux-starter (의존성 순서)
      - name: Publish all modules
        env:
          GPG_SECRET_KEY_BASE64: ${{ secrets.GPG_SECRET_KEY_BASE64 }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
        run: |
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%s' "$GPG_SECRET_KEY_BASE64" | base64 --decode)"
          export ORG_GRADLE_PROJECT_signingInMemoryKey
          for module in core web webflux web-starter webflux-starter; do
            ./gradlew ":keycloak-spring-security-${module}:publish" --no-daemon
          done

  # 배포 완료 알림 (선택사항)
  notify:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ steps.version.outputs.version }}"
          # 직전 태그 이후 머지된 PR 기반 "What's Changed" 변경내역 자동 생성 (.github/release.yml 카테고리 적용)
          generate_release_notes: true
          body: |
            ## Keycloak Spring Security v${{ steps.version.outputs.version }}

            ### Servlet (Spring MVC)
            ```groovy
            implementation 'io.github.l-dxd:keycloak-spring-security-web-starter:${{ steps.version.outputs.version }}'
            ```

            ### Reactive (Spring WebFlux)
            ```groovy
            implementation 'io.github.l-dxd:keycloak-spring-security-webflux-starter:${{ steps.version.outputs.version }}'
            ```

            ### Maven
            ```xml
            <!-- Servlet -->
            <dependency>
                <groupId>io.github.l-dxd</groupId>
                <artifactId>keycloak-spring-security-web-starter</artifactId>
                <version>${{ steps.version.outputs.version }}</version>
            </dependency>

            <!-- Reactive -->
            <dependency>
                <groupId>io.github.l-dxd</groupId>
                <artifactId>keycloak-spring-security-webflux-starter</artifactId>
                <version>${{ steps.version.outputs.version }}</version>
            </dependency>
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
