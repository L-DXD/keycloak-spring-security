name: CI

on:
  push:
    branches:
      - main
      - v3
      - 'v3/**'
  pull_request:
    branches:
      - main
      - v3
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # BUILD-01·02·03: Boot 4.1 BOM으로 빌드·테스트, 배포 모듈 의존성 검사. Java 17(최소)과 21에서 돈다.
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v3' }}

      - name: Build
        run: ./gradlew build printSpringVersions

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java }}
          path: '**/build/reports/tests/'
          retention-days: 7

  # BUILD-04: 다음 Boot 판으로 미리 돌려 본다. 실패해도 머지를 막지 않는다.
  boot-preview:
    name: Boot preview (${{ matrix.boot }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        boot: ['4.2.0-RC2']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build with Spring Boot ${{ matrix.boot }}
        run: ./gradlew build printSpringVersions -PspringBootVersion=${{ matrix.boot }}

  # 배포 전에 pom·jar가 제대로 만들어지는지 본다 (서명·업로드는 하지 않는다)
  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Verify artifacts
        run: |
          for module in core web web-starter; do
            echo "=== keycloak-spring-security-${module} ==="
            ls -la ~/.m2/repository/io/github/l-dxd/keycloak-spring-security-${module}/*/
          done
