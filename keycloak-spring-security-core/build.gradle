plugins {
    id 'java-library'
}

description = 'Keycloak Spring Security Core - 세션 모델·저장소(JDBC·메모리), 암호, 토큰 규칙, 세션 이벤트 (Servlet·WebFlux 의존 없음)'

dependencies {
    // 순수 로직 모듈. jakarta.servlet, org.springframework.web 의존 금지 (EXT-04)
    api 'org.springframework.security:spring-security-core'
    api 'org.springframework.security:spring-security-oauth2-jose'
    // 기본 세션 저장소(JdbcKeycloakSessionStore). WebFlux(3.1.0)도 같은 저장소를 쓴다
    api 'org.springframework:spring-jdbc'

    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.postgresql:postgresql'
}

// 저장소 계약 테스트를 PostgreSQL에도 돌린다 (STORE-01). 주소가 없으면 그 테스트만 건너뛴다
tasks.named('test', Test) {
    ['KSS_TEST_DB_URL', 'KSS_TEST_DB_USERNAME', 'KSS_TEST_DB_PASSWORD'].each { name ->
        def value = providers.environmentVariable(name)
        if (value.isPresent()) {
            environment name, value.get()
        }
    }
}

// ./gradlew printSpringVersions: Boot BOM이 고른 Spring Framework·Security 판을 찍는다 (BUILD-01 확인용)
tasks.register('printSpringVersions') {
    group = 'help'
    description = 'Boot BOM이 고른 Spring Framework·Security 판을 찍는다'
    def artifacts = configurations.named('runtimeClasspath').flatMap { it.incoming.artifacts.resolvedArtifacts }
    def bootVersion = springBootVersion
    doLast {
        def resolved = artifacts.get().collect { it.id.componentIdentifier }.findAll { it instanceof ModuleComponentIdentifier }
        def pick = { String g, String a -> resolved.find { it.group == g && it.module == a }?.version }
        println "Spring Boot BOM      ${bootVersion}"
        println "Spring Framework     ${pick('org.springframework', 'spring-core')}"
        println "Spring Security      ${pick('org.springframework.security', 'spring-security-core')}"
    }
}
