# 로컬 화면 흉내 (테스트 전용, integration-tests/compose.yaml). 인증서는 gen-test-certs.sh가 빌드 폴더에 만든다
server {
    listen 443 ssl;
    server_name app.kss.test;
    ssl_certificate     /etc/nginx/tls/app.crt;
    ssl_certificate_key /etc/nginx/tls/app.key;
    root /usr/share/nginx/html/app;
    add_header Cache-Control "no-store" always;
    # 로그인 뒤 돌아오는 경로(/items/3 등)와 /logged-out도 같은 화면을 준다
    location / {
        try_files $uri /index.html;
    }
}

# 다른 화면 흉내: evil.kss.test(화면과 같은 사이트, 다른 origin), evil.test(다른 사이트). 빈 페이지만 준다
server {
    listen 443 ssl;
    server_name evil.kss.test evil.test;
    ssl_certificate     /etc/nginx/tls/app.crt;
    ssl_certificate_key /etc/nginx/tls/app.key;
    root /usr/share/nginx/html/evil;
    add_header Cache-Control "no-store" always;
    location / {
        try_files $uri /index.html;
    }
}
