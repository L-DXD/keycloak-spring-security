plugins {
    id 'java'
    id 'org.springframework.boot'
}

description = 'v3 샘플 앱 (가상 프로젝트) + E2E. 배포하지 않는다 (docs/v3/03-검증-환경.md)'

dependencies {
    implementation project(':keycloak-spring-security-web-starter')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'
}

// 샘플 앱은 실행 jar를 만들지 않는다. bootRun으로만 띄운다
tasks.named('bootJar') { enabled = false }

def e2eDir = layout.buildDirectory.dir('e2e')
def keycloakDir = rootProject.layout.projectDirectory.dir('integration-tests/keycloak')

// 테스트 CA·서버 인증서 (integration-tests/keycloak/gen-test-certs.sh). start-local.sh·local-stack.sh와 같은 폴더를 쓴다.
// 스크립트가 "이미 있으면 그대로 둔다"를 맡는다. 출력 폴더를 Gradle 출력으로 적지 않는다:
// 적으면 처음 돌 때(새 작업 폴더 등) Gradle이 그 폴더를 지워 CA가 바뀌고, 이미 띄운 Keycloak이 샘플 앱을 믿지 못한다
def e2eCerts = tasks.register('e2eCerts', Exec) {
    group = 'verification'
    description = 'E2E·로컬 실행용 테스트 CA와 인증서를 만든다 (이미 있으면 그대로 둔다)'
    def out = e2eDir.map { it.dir('tls') }
    commandLine 'bash', keycloakDir.file('gen-test-certs.sh').asFile.absolutePath, out.get().asFile.absolutePath
}

// *.kss.test를 테스트 JVM 안에서만 127.0.0.1로 푼다. /etc/hosts나 외부 DNS를 쓰지 않는다
def e2eHosts = tasks.register('e2eHosts') {
    def out = e2eDir.map { it.file('hosts') }
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast {
        def localName = InetAddress.localHost.hostName
        out.get().asFile.text = "127.0.0.1 localhost ${localName} app.kss.test api.kss.test sso.kss.test\n::1 localhost\n"
    }
}

// 손으로 띄우기: ./gradlew :integration-tests:servlet-app:bootRun  (두 번째 앱은 --args=--spring.profiles.active=demo2)
// Keycloak·DB·화면은 integration-tests/local-stack.sh up 으로 먼저 띄운다 (docs/v3/03-검증-환경.md 5절).
// *.kss.test 이름은 E2E와 같은 hosts 파일로 이 JVM 안에서만 푼다
tasks.named('bootRun', JavaExec) {
    dependsOn e2eCerts, e2eHosts
    def hosts = e2eDir.map { it.file('hosts') }
    jvmArgumentProviders.add({ ["-Djdk.net.hosts.file=${hosts.get().asFile.absolutePath}".toString()] } as CommandLineArgumentProvider)
}

// E2E-01·02: ./gradlew :integration-tests:servlet-app:e2eTest
tasks.register('e2eTest', Test) {
    group = 'verification'
    description = 'E2E: 샘플 앱 + 실제 Keycloak + PostgreSQL. Docker가 없으면 KSS_E2E_KEYCLOAK_URL, KSS_E2E_DB_URL을 준다'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
        if (!providers.gradleProperty('includeSlow').isPresent()) {
            excludeTags 'slow'
        }
    }
    dependsOn e2eCerts, e2eHosts
    // start-local.sh로 띄운 Keycloak을 다른 작업 폴더(git worktree 등)에서 쓸 때는 그 Keycloak이 믿는 인증서 폴더를 준다.
    // 새 작업 폴더의 build/e2e/tls는 Gradle이 처음 돌 때 지우고 새로 만들어, 그 Keycloak이 샘플 앱을 믿지 못한다
    def tls = providers.environmentVariable('KSS_E2E_TLS_DIR').map { new File(it) }
        .orElse(e2eDir.map { it.dir('tls').asFile })
    def hosts = e2eDir.map { it.file('hosts') }
    def realm = keycloakDir.file('realm-kss-demo.json')
    inputs.file(realm)
    jvmArgumentProviders.add({ [
        "-Djdk.net.hosts.file=${hosts.get().asFile.absolutePath}".toString(),
        "-Dkss.e2e.tls-dir=${tls.get().absolutePath}".toString(),
        "-Dkss.e2e.realm-file=${realm.asFile.absolutePath}".toString(),
    ] } as CommandLineArgumentProvider)
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    shouldRunAfter tasks.named('test')
}
